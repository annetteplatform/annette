play {
  application.loader = biz.lobachev.annette.api_gateway.AnnetteApiLoader

  # TODO: play.filters.headers.contentSecurityPolicy is deprecated in 2.7.0.  Please use play.filters.csp.CSPFilter instead.
  filters.headers.contentSecurityPolicy = "default-src * 'unsafe-inline' 'unsafe-eval' data:; script-src * 'unsafe-inline' 'unsafe-eval'; connect-src * 'unsafe-inline'; img-src * data: blob: 'unsafe-inline'; frame-src *; style-src * 'unsafe-inline';"

  filters.disabled += play.filters.csrf.CSRFFilter
  filters.disabled += play.filters.headers.SecurityHeadersFilter
  filters.disabled += play.filters.hosts.AllowedHostsFilter

  filters.headers.frameOptions = sameorigin

  filters.cors {
    pathPrefixes = ["/"]
    allowedOrigins = null // ["*"]
    allowedHttpMethods = null // ["GET", "POST", "OPTIONS", "PUT", "DELETE"]
    allowedHttpHeaders = null // ["Accept", "Authorization"]
    #  preflightMaxAge = 3 days
  }

  server.pidfile.path = "/dev/null"
  http.secret.key = ${?SECRET_KEY}

  http.parser.maxMemoryBuffer = 20m
  http.parser.maxMemoryBuffer = ${?MAX_MEMORY_BUFFER}
  http.parser.maxDiskBuffer = 200m
  http.parser.maxDiskBuffer = ${?MAX_DIST_BUFFER}
}

pekko.http.server.parsing.max-content-length = 200m
pekko.http.client.parsing.max-content-length = 200m

# Pekko HTTP/2 server preview (slice 002 scaffold; populated by slices 004-012 as services
# migrate to gRPC). Per dev/migration/002-build-and-gateway-foundations.md step 6.
pekko.http.server.preview.enable-http2 = on

# Pekko gRPC clients for the 9 backend microservices (slice 013). Ports follow the
# dev-mode port table (dev/migration/002 §7 / AGENTS.md).
pekko.grpc.client {
  authorization {
    host = "127.0.0.1"
    host = ${?SERVICES_AUTHORIZATION_HOST}
    port = 8512
    port = ${?SERVICES_AUTHORIZATION_PORT}
    use-tls = false
  }
  service-catalog {
    host = "127.0.0.1"
    host = ${?SERVICES_SERVICE_CATALOG_HOST}
    port = 8511
    port = ${?SERVICES_SERVICE_CATALOG_PORT}
    use-tls = false
  }
  application {
    host = "127.0.0.1"
    host = ${?SERVICES_APPLICATION_HOST}
    port = 8510
    port = ${?SERVICES_APPLICATION_PORT}
    use-tls = false
  }
  bpm-repository {
    host = "127.0.0.1"
    host = ${?SERVICES_BPM_REPOSITORY_HOST}
    port = 8513
    port = ${?SERVICES_BPM_REPOSITORY_PORT}
    use-tls = false
  }
  cms {
    host = "127.0.0.1"
    host = ${?SERVICES_CMS_HOST}
    port = 8514
    port = ${?SERVICES_CMS_PORT}
    use-tls = false
  }
  subscriptions {
    host = "127.0.0.1"
    host = ${?SERVICES_SUBSCRIPTIONS_HOST}
    port = 8515
    port = ${?SERVICES_SUBSCRIPTIONS_PORT}
    use-tls = false
  }
  org-structure {
    host = "127.0.0.1"
    host = ${?SERVICES_ORG_STRUCTURE_HOST}
    port = 8516
    port = ${?SERVICES_ORG_STRUCTURE_PORT}
    use-tls = false
  }
  persons {
    host = "127.0.0.1"
    host = ${?SERVICES_PERSONS_HOST}
    port = 8517
    port = ${?SERVICES_PERSONS_PORT}
    use-tls = false
  }
  principal-groups {
    host = "127.0.0.1"
    host = ${?SERVICES_PRINCIPAL_GROUPS_HOST}
    port = 8518
    port = ${?SERVICES_PRINCIPAL_GROUPS_PORT}
    use-tls = false
  }
}

annette {
  authentication {
    # Configuration for Keycloak authentication
    keycloak {

      # Default Keycloak's configuration
      # It can be found in Installation tab of Keycloak's client configuration in Keycloak Admin Console
      config {
        realm = ${?KEYCLOAK_REALM}
        auth-server-url = ${?KEYCLOAK_URL}
        public-auth-server-url = ${?KEYCLOAK_URL}
        public-auth-server-url = ${?KEYCLOAK_PUBLIC_URL}
        ssl-required = external
        ssl-required = ${?KEYCLOAK_SSL_REQUIRED}
        resource = ${?KEYCLOAK_CLIENT}
        public-client = true
        public-client = ${?KEYCLOAK_PUBLIC_CLIENT}
      }

      # Specific Keycloak configurations that override default configuration for applications
      # application-config {
      #   application-name {
      #     resource = application-client-id
      #   }
      # }

      # Define sources of principal assignment (constant value, from token or header)
      principals = [
        {
          #   Principal type
          type = "person"
          #   Source of assignment: const, token, header
          source = "token"
          #   Source field (only for token source)
          field = person_id
          field = ${?PERSON_ID_FIELD}
          #   Is this assignment required (only for token or header source)
          required = true
        }

        # {
        #   Principal type
        #    type = "person"
