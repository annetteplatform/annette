include "application.dev.conf"

# docker-compose: gRPC clients target the compose service names (each container
# exposes 9000). Host ports (8510-8518) are only mapped for host access.

SERVICES_APPLICATION_HOST = "application"
SERVICES_SERVICE_CATALOG_HOST = "service-catalog"
SERVICES_AUTHORIZATION_HOST = "authorization"
SERVICES_BPM_REPOSITORY_HOST = "bpm-repository"
SERVICES_CMS_HOST = "cms"
SERVICES_SUBSCRIPTIONS_HOST = "subscriptions"
SERVICES_PERSONS_HOST = "persons"
SERVICES_ORG_STRUCTURE_HOST = "org-structure"
SERVICES_PRINCIPAL_GROUPS_HOST = "principal-groups"

SERVICES_APPLICATION_PORT = 9000
SERVICES_SERVICE_CATALOG_PORT = 9000
SERVICES_AUTHORIZATION_PORT = 9000
SERVICES_BPM_REPOSITORY_PORT = 9000
SERVICES_CMS_PORT = 9000
SERVICES_SUBSCRIPTIONS_PORT = 9000
SERVICES_PERSONS_PORT = 9000
SERVICES_ORG_STRUCTURE_PORT = 9000
SERVICES_PRINCIPAL_GROUPS_PORT = 9000
