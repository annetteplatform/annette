include "application.dev.conf"

lagom.circuit-breaker.default.enabled = off

# Pekko Artery canonical address for docker-compose deployments (slice 002 scaffold).
# Gateway gets the default Pekko Artery port (17355); microservices get distinct ports per
# the dev-mode port table in AGENTS.md. Per dev/migration/002-build-and-gateway-foundations.md step 6.
pekko.remote.artery.canonical.hostname = "127.0.0.1"
pekko.remote.artery.canonical.port = 17355

annette.discovery.services {
  application = "http://application:9000"
  service-catalog = "http://service-catalog:9000"
  authorization = "http://authorization:9000"
  bpm-repository = "http://bpm-repository:9000"
  cms = "http://cms:9000"
  subscriptions = "http://subscriptions:9000"
  persons = "http://persons:9000"
  org-structure = "http://org-structure:9000"
  principal-groups = "http://principal-groups:9000"
}
