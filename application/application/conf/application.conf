pekko.actor.provider = cluster

# gRPC requires HTTP/2 (h2c prior knowledge) on the server bind.
pekko.http.server.preview.enable-http2 = on
play.application.loader = biz.lobachev.annette.application.impl.ApplicationServiceMain
play.http.secret.key = ${?SECRET_KEY}
play.server.pidfile.path = "/dev/null"

pekko.cluster.sharding.state-store-mode = ddata

annette {
  cluster {
    system-name = "application"
    system-name = ${?AKKA_CLUSTER_SYSTEM_NAME}
  }
  http {
    host = "127.0.0.1"
    host = ${?HTTP_HOST}
    port = 8510
    port = ${?HTTP_PORT}
  }
}

indexing {
  connection {
    url = "https://localhost:9200"
    url = ${?INDEXING_URL}
    username = "admin"
    username = ${?INDEXING_USERNAME}
    password = "admin"
    password = ${?INDEXING_PASSWORD}
    allow-insecure = false
    allow-insecure = ${?INDEXING_ALLOW_INSECURE}
  }

  application-index {
    index = ${?INDEX_PREFIX}application-application
    index = ${?APPLICATION_APPLICATION_INDEX}
    mappings {
      id {
        type = keyword
      }
      name {
        type = text
        fields {
          keyword {
            type = keyword
          }
        }
      }
      label {
        type = text
      }
      labelDescription {
        type = text
      }
      updatedAt {
        type = date
      }
    }
  }

  language-index {
    index = ${?INDEX_PREFIX}application-language
    index = ${?APPLICATION_LANGUAGE_INDEX}
    mappings {
      id {
        type = keyword
      }
      name {
        type = text
        fields {
          keyword {
            type = keyword
          }
        }
      }
      updatedAt {
        type = date
      }
    }
  }

  translation-index {
    index = ${?INDEX_PREFIX}application-translation
    index = ${?APPLICATION_TRANSLATION_INDEX}
    mappings {
      id {
        type = keyword
      }
      name {
        type = text
        fields {
          keyword {
            type = keyword
          }
        }
      }
      updatedAt {
        type = date
      }
    }
  }
}

cassandra.default {
  ## list the contact points here
  contact-points = "localhost:9042"
  contact-points = ${?CASSANDRA_URL}
  ## keyspace name
  keyspace = ${?KEYSPACE_PREFIX}application
  keyspace = ${?KEYSPACE}
  ## authentication
  authentication {
    username = "cassandra"
    username = ${?CASSANDRA_USERNAME}
    password = "cassandra"
    password = ${?CASSANDRA_PASSWORD}
  }

  session-provider = pekko.persistence.cassandra.ConfigSessionProvider
  replication-factor = ${?CASSANDRA_REPLICATION_FACTOR}
}

cassandra-quill {
  session {
    contact-points = ["localhost:9042", ${?CASSANDRA_URL}]
    credentials {
      username = "cassandra"
      username = ${?CASSANDRA_USERNAME}
      password = "cassandra"
      password = ${?CASSANDRA_PASSWORD}
    }
  }
  keyspace = ${?KEYSPACE_PREFIX}application
  keyspace = ${?KEYSPACE}
  keyspace-autocreate = true
  replication-factor = ${?CASSANDRA_REPLICATION_FACTOR}
}

# DataStax driver 4 config — used by BOTH Pekko Persistence Cassandra and Pekko
# Projection Cassandra (both resolve their session against this path; verified
# at runtime for cms in slice 011, applied to all services in slice 013).
datastax-java-driver {
  basic {
    contact-points = ["localhost:9042"]
    contact-points = ${?CASSANDRA_URL}
    load-balancing-policy.local-datacenter = "datacenter1"
    load-balancing-policy.local-datacenter = ${?CASSANDRA_DATACENTER}
  }
  advanced.auth-provider {
    class = PlainTextAuthProvider
    username = "cassandra"
    username = ${?CASSANDRA_USERNAME}
    password = "cassandra"
    password = ${?CASSANDRA_PASSWORD}
  }
}

# Pekko Persistence Cassandra. Without explicit plugin ids the entity asks
# time out on first Recovery (verified at runtime for cms in slice 011).
pekko.persistence.journal.plugin = "pekko.persistence.cassandra.journal"
pekko.persistence.snapshot-store.plugin = "pekko.persistence.cassandra.snapshot"

cassandra-journal = ${cassandra.default}
cassandra-snapshot-store = ${cassandra.default}

# Pekko Persistence Cassandra
pekko.persistence.cassandra {
  journal {
    keyspace = ${?KEYSPACE_PREFIX}application
    keyspace = ${?KEYSPACE}
    keyspace-autocreate = true
    tables-autocreate = true
  }
  snapshot {
    keyspace = ${?KEYSPACE_PREFIX}application
    keyspace = ${?KEYSPACE}
    keyspace-autocreate = true
    tables-autocreate = true
  }
}

# events-by-tag configuration. NOTE (verified at runtime in slice 011): in
# pekko-persistence-cassandra these keys live under `events-by-tag` directly —
# NOT under `journal.events-by-tag` / `query.events-by-tag` as in the Lagom-era
# layout. With the wrong paths the defaults (EC delay 5s, first-time-bucket
# 2015) silently apply and projections stall scanning ~4000 empty day-buckets.
pekko.persistence.cassandra.events-by-tag.flush-interval = 100ms
pekko.persistence.cassandra.events-by-tag.flush-interval = ${?FLUSH_INTERVAL}
pekko.persistence.cassandra.events-by-tag.eventual-consistency-delay = 100ms
pekko.persistence.cassandra.events-by-tag.eventual-consistency-delay = ${?EVENTUAL_CONSISTENCY_DELAY}
pekko.persistence.cassandra.events-by-tag.delayed-event-timeout = 30s
pekko.persistence.cassandra.events-by-tag.delayed-event-timeout = ${?DELAYED_EVENT_TIMEOUT}
pekko.persistence.cassandra.events-by-tag.first-time-bucket = "20211201T00:00"
pekko.persistence.cassandra.events-by-tag.first-time-bucket = ${?FIRST_TIME_BUCKET}
pekko.persistence.cassandra.query.refresh-interval = 100ms
pekko.persistence.cassandra.query.refresh-interval = ${?REFRESH_INTERVAL}

# Pekko Projection Cassandra offset store
pekko.projection.cassandra {
  session-config-path = "pekko.persistence.cassandra"
  offset-store {
    keyspace = ${?KEYSPACE_PREFIX}pekko_projection
    keyspace = ${?PEKKO_PROJECTION_KEYSPACE}
    table = "offset_store"
    management-table = "projection_management"
  }
}
