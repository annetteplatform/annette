// The two coexist during the migration: the plain trait is what the gateway's controllers
// consume; the generated trait is what the service impl extends.
//
// 33 RPCs mirror ServiceCatalogServiceLagomApi.descriptor's pathCalls 1:1.
//
// Complex types serialized as JSON strings per D1 (play-json at the gateway; protobuf
// intra-cluster for primitive/simple types):
//   - Icon (sealed trait: FileIcon/FrameworkIcon)
//   - ServiceLink (sealed trait: ExternalLink/InternalLink)
//   - ServiceItem (sealed trait: Service/Group) — return type only
//   - UserServiceItem (sealed trait: UserService/UserGroup) — in ScopeServicesResult/UserServicesResult
// MultiLanguageText = Map[String, String] → proto map<string, string>.

service ServiceCatalogService {
  // === Category ===
  rpc CreateCategory(CreateCategoryPayload) returns (google.protobuf.Empty);
  rpc UpdateCategory(UpdateCategoryPayload) returns (google.protobuf.Empty);
  rpc DeleteCategory(DeleteCategoryPayload) returns (google.protobuf.Empty);
  rpc GetCategory(GetCategoryRequest) returns (Category);
  rpc GetCategories(GetCategoriesRequest) returns (GetCategoriesResponse);
  rpc FindCategories(CategoryFindQuery) returns (FindResult);

  // === Scope ===
  rpc CreateScope(CreateScopePayload) returns (google.protobuf.Empty);
  rpc UpdateScope(UpdateScopePayload) returns (google.protobuf.Empty);
  rpc ActivateScope(ActivateScopePayload) returns (google.protobuf.Empty);
  rpc DeactivateScope(DeactivateScopePayload) returns (google.protobuf.Empty);
  rpc DeleteScope(DeleteScopePayload) returns (google.protobuf.Empty);
  rpc GetScope(GetScopeRequest) returns (Scope);
  rpc GetScopes(GetScopesRequest) returns (GetScopesResponse);
  rpc FindScopes(FindScopeQuery) returns (FindResult);

  // === Scope Principal ===
  rpc AssignScopePrincipal(AssignScopePrincipalPayload) returns (google.protobuf.Empty);
  rpc UnassignScopePrincipal(UnassignScopePrincipalPayload) returns (google.protobuf.Empty);
  rpc FindScopePrincipals(FindScopePrincipalQuery) returns (FindResult);

  // === Service Item (Group/Service) ===
  rpc CreateGroup(CreateGroupPayload) returns (google.protobuf.Empty);
  rpc UpdateGroup(UpdateGroupPayload) returns (google.protobuf.Empty);
  rpc CreateService(CreateServicePayload) returns (google.protobuf.Empty);
  rpc UpdateService(UpdateServicePayload) returns (google.protobuf.Empty);
  rpc ActivateServiceItem(ActivateServiceItemPayload) returns (google.protobuf.Empty);
  rpc DeactivateServiceItem(DeactivateServiceItemPayload) returns (google.protobuf.Empty);
  rpc DeleteServiceItem(DeleteServiceItemPayload) returns (google.protobuf.Empty);
  rpc GetServiceItem(GetServiceItemRequest) returns (ServiceItemResponse);
  rpc GetServiceItems(GetServiceItemsRequest) returns (GetServiceItemsResponse);
  rpc FindServiceItems(FindServiceItemsQuery) returns (FindResult);

  // === Service Principal ===
  rpc AssignServicePrincipal(AssignServicePrincipalPayload) returns (google.protobuf.Empty);
  rpc UnassignServicePrincipal(UnassignServicePrincipalPayload) returns (google.protobuf.Empty);
  rpc FindServicePrincipals(FindServicePrincipalQuery) returns (FindResult);

  // === User queries ===
  rpc FindScopesByCategory(ScopeByCategoryFindQuery) returns (ScopeByCategoryFindResultResponse);
  rpc GetScopeServices(ScopeServicesQuery) returns (ScopeServicesResult);
