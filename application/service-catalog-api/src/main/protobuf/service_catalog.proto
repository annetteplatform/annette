syntax = "proto3";

package biz.lobachev.annette.service_catalog.api;

option java_package = "biz.lobachev.annette.service_catalog.api.grpc";

import "google/protobuf/empty.proto";

// Service-catalog service — Pekko gRPC contract for the migrated service-catalog microservice.
