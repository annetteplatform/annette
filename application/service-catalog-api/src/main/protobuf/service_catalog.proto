// =============================================================================
// Shared / common messages
// =============================================================================

message AnnettePrincipal {
  string code = 1;
}

message SortBy {
  string field = 1;
  optional bool descending = 2;
}

// =============================================================================
// Category DTOs (CategoryId = String)
// =============================================================================

message CreateCategoryPayload {
  string id = 1;
  string name = 2;
  AnnettePrincipal created_by = 3;
}

message UpdateCategoryPayload {
  string id = 1;
  string name = 2;
  AnnettePrincipal updated_by = 3;
}

message DeleteCategoryPayload {
  string id = 1;
  AnnettePrincipal deleted_by = 2;
}

message Category {
  string id = 1;
  string name = 2;
  string updated_at = 3;
  AnnettePrincipal updated_by = 4;
}

message GetCategoryRequest {
  string id = 1;
  optional string source = 2;
}

message GetCategoriesRequest {
  repeated string ids = 1;
  optional string source = 2;
}

message GetCategoriesResponse {
  repeated Category categories = 1;
}

message CategoryFindQuery {
  int32 offset = 1;
  int32 size = 2;
  optional string filter = 3;
  optional string name = 4;
  repeated SortBy sort_by = 5;
}

// =============================================================================
// Scope DTOs (ScopeId = String)
// =============================================================================

message Scope {
  string id = 1;
  string name = 2;
  string description = 3;
  string category_id = 4;
  repeated string children = 5;
  bool active = 6;
  AnnettePrincipal updated_by = 7;
  string updated_at = 8;
}

message CreateScopePayload {
  string id = 1;
  string name = 2;
  string description = 3;
  string category_id = 4;
  repeated string children = 5;
  AnnettePrincipal created_by = 6;
}

message UpdateScopePayload {
  string id = 1;
  optional string name = 2;
  optional string description = 3;
  optional string category_id = 4;
  repeated string children = 5; // present if field is being updated
  bool children_updated = 6;    // flag to distinguish "not set" from "empty list"
  AnnettePrincipal updated_by = 7;
}

message ActivateScopePayload {
  string id = 1;
  AnnettePrincipal updated_by = 2;
}

message DeactivateScopePayload {
  string id = 1;
  AnnettePrincipal updated_by = 2;
}

message DeleteScopePayload {
  string id = 1;
  AnnettePrincipal deleted_by = 2;
}

message GetScopeRequest {
  string id = 1;
  optional string source = 2;
}

message GetScopesRequest {
  repeated string ids = 1;
  optional string source = 2;
}

message GetScopesResponse {
  repeated Scope scopes = 1;
}

message FindScopeQuery {
  int32 offset = 1;
  int32 size = 2;
  optional string filter = 3;
  repeated string categories = 4;
  optional bool active = 5;
  repeated SortBy sort_by = 6;
}

// =============================================================================
// ScopePrincipal DTOs
// =============================================================================

message AssignScopePrincipalPayload {
  string scope_id = 1;
  AnnettePrincipal principal = 2;
  AnnettePrincipal updated_by = 3;
}

message UnassignScopePrincipalPayload {
  string scope_id = 1;
  AnnettePrincipal principal = 2;
  AnnettePrincipal updated_by = 3;
}

message FindScopePrincipalQuery {
  int32 offset = 1;
  int32 size = 2;
  repeated string scopes = 3;
  repeated string principal_codes = 4;
  repeated SortBy sort_by = 5;
}

// =============================================================================
// ServiceItem DTOs (ServiceItemId = String)
// ServiceItem is a sealed trait (Service/Group) → returned as JSON string.
// Icon is a sealed trait → JSON string.
// ServiceLink is a sealed trait → JSON string.
// MultiLanguageText = Map[String, String] → proto map.
// =============================================================================

// Response wrapper: ServiceItem sealed trait serialized as JSON string.
message ServiceItemResponse {
  string item_json = 1;
}

message GetServiceItemRequest {
  string id = 1;
  optional string source = 2;
}

message GetServiceItemsRequest {
  repeated string ids = 1;
  optional string source = 2;
}

message GetServiceItemsResponse {
  repeated string items_json = 1; // each item serialized as JSON string
}

message CreateGroupPayload {
  string id = 1;
  string name = 2;
  string description = 3;
  string icon = 4;                          // Icon sealed trait as JSON
  map<string, string> label = 5;            // MultiLanguageText
  map<string, string> label_description = 6;
  repeated string children = 7;
  AnnettePrincipal created_by = 8;
}

message UpdateGroupPayload {
  string id = 1;
  optional string name = 2;
  optional string description = 3;
  optional string icon = 4;                 // Icon sealed trait as JSON
  optional string label_json = 5;           // MultiLanguageText as JSON (Option[Map])
  optional string label_description_json = 6;
  bool children_updated = 7;
  repeated string children = 8;
  AnnettePrincipal updated_by = 9;
}

message CreateServicePayload {
  string id = 1;
  string name = 2;
  string description = 3;
  string icon = 4;                          // Icon sealed trait as JSON
  map<string, string> label = 5;            // MultiLanguageText
  map<string, string> label_description = 6;
  string link = 7;                          // ServiceLink sealed trait as JSON
  AnnettePrincipal created_by = 8;
}

message UpdateServicePayload {
  string id = 1;
  optional string name = 2;
  optional string description = 3;
  optional string icon = 4;
  optional string label_json = 5;
  optional string label_description_json = 6;
  optional string link = 7;
  AnnettePrincipal updated_by = 8;
}

message ActivateServiceItemPayload {
  string id = 1;
  AnnettePrincipal updated_by = 2;
}

message DeactivateServiceItemPayload {
  string id = 1;
  AnnettePrincipal updated_by = 2;
}

message DeleteServiceItemPayload {
  string id = 1;
  AnnettePrincipal deleted_by = 2;
}

message FindServiceItemsQuery {
  int32 offset = 1;
  int32 size = 2;
  optional string filter = 3;
  repeated string types = 4;
  repeated string ids = 5;
  optional bool active = 6;
  repeated SortBy sort_by = 7;
}

// =============================================================================
// ServicePrincipal DTOs
// =============================================================================

message AssignServicePrincipalPayload {
  string service_id = 1;
  AnnettePrincipal principal = 2;
  AnnettePrincipal updated_by = 3;
}

message UnassignServicePrincipalPayload {
  string service_id = 1;
  AnnettePrincipal principal = 2;
  AnnettePrincipal updated_by = 3;
}

message FindServicePrincipalQuery {
  int32 offset = 1;
  int32 size = 2;
  repeated string services = 3;
  repeated string principal_codes = 4;
  repeated SortBy sort_by = 5;
}

// =============================================================================
// User query DTOs
// =============================================================================

message ScopeByCategoryFindQuery {
  repeated string categories = 1;
  repeated string principal_codes = 2;
}

message ScopeByCategoryFindResultResponse {
  repeated ScopeByCategoryFindResult results = 1;
}

message ScopeByCategoryFindResult {
  string scope_id = 1;
  AnnettePrincipal principal = 2;
}

message ScopeServicesQuery {
  string scope_id = 1;
  repeated string principal_codes = 2;
  string language_id = 3;
}

message ScopeServicesResult {
  repeated string root = 1;
  repeated string service_items_json = 2; // UserServiceItem sealed trait as JSON
}

message FindUserServicesQuery {
  int32 offset = 1;
  int32 size = 2;
  string filter = 3;
  repeated string principal_codes = 4;
  string language_id = 5;
}

message UserServicesResult {
  int64 total = 1;
  repeated string services_json = 2; // UserService sealed trait as JSON
}

// =============================================================================
// Find-result (generic; mirrors biz.lobachev.annette.core.model.indexing.FindResult)
// =============================================================================

message FindResult {
  int64 total = 1;
  repeated HitResult hits = 2;
}

message HitResult {
  string id = 1;
  float score = 2;
  string updated_at = 3;
}
