  rpc CreateRole(CreateRolePayload) returns (google.protobuf.Empty);
  rpc UpdateRole(UpdateRolePayload) returns (google.protobuf.Empty);
  rpc DeleteRole(DeleteRolePayload) returns (google.protobuf.Empty);
  rpc GetRole(GetRoleRequest) returns (AuthRole);
  rpc GetRoles(GetRolesRequest) returns (GetRolesResponse);
  rpc FindRoles(AuthRoleFindQuery) returns (FindResult);

  // === Role ↔ Principal ===
