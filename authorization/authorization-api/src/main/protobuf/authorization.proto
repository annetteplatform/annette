// =============================================================================
// Shared / common messages
// =============================================================================

// Mirrors biz.lobachev.annette.core.model.auth.Permission (code format: "id~arg1~arg2~arg3").
message Permission {
  string id = 1;
  string arg1 = 2;
  string arg2 = 3;
  string arg3 = 4;
}

// Mirrors biz.lobachev.annette.core.model.auth.AnnettePrincipal (code format: "type~id").
message AnnettePrincipal {
  string code = 1;
}

// Mirrors biz.lobachev.annette.core.model.auth.AuthSource.
message AuthSource {
  string source_type = 1; // corresponds to Scala SourceType = String
  string source_id = 2;   // corresponds to Scala SourceId = String
}

// Mirrors biz.lobachev.annette.core.model.indexing.SortBy.
message SortBy {
  string field = 1;
  optional bool descending = 2;
}

// =============================================================================
// Role DTOs
// =============================================================================

message CreateRolePayload {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated Permission permissions = 4;
  AnnettePrincipal created_by = 5;
}

message UpdateRolePayload {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated Permission permissions = 4;
  AnnettePrincipal updated_by = 5;
}

message DeleteRolePayload {
  string id = 1;
  AnnettePrincipal deleted_by = 2;
}

message AuthRole {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated Permission permissions = 4;
  string updated_at = 5; // RFC3339 / ISO-8601 offset-date-time
  AnnettePrincipal updated_by = 6;
}

message GetRoleRequest {
  string id = 1;
  optional string source = 2;
}

message GetRolesRequest {
  repeated string ids = 1;
  optional string source = 2;
}

message GetRolesResponse {
  repeated AuthRole roles = 1;
}

message AuthRoleFindQuery {
  int32 offset = 1;
  int32 size = 2;
  optional string filter = 3;
  repeated SortBy sort_by = 4;
}

message AssignPrincipalPayload {
  string role_id = 1;
  AnnettePrincipal principal = 2;
  AnnettePrincipal updated_by = 3;
}

message UnassignPrincipalPayload {
  string role_id = 1;
  AnnettePrincipal principal = 2;
  AnnettePrincipal updated_by = 3;
}

message GetRolePrincipalsRequest {
  string id = 1;
  optional string source = 2;
}

message GetRolePrincipalsResponse {
  repeated AnnettePrincipal principals = 1;
}

// =============================================================================
// Assignment DTOs
// =============================================================================

message AssignPermissionPayload {
  AnnettePrincipal principal = 1;
  Permission permission = 2;
  AuthSource source = 3;
  AnnettePrincipal updated_by = 4;
  optional string updated_at = 5; // RFC3339 / ISO-8601 offset-date-time
}

message UnassignPermissionPayload {
  AnnettePrincipal principal = 1;
  Permission permission = 2;
  AuthSource source = 3;
  AnnettePrincipal updated_by = 4;
  optional string updated_at = 5;
}

message FindPermissionsRequest {
  repeated AnnettePrincipal principals = 1;
  repeated string permission_ids = 2;
}

message FindPermissionsResponse {
  repeated PermissionAssignment assignments = 1;
}

message CheckPermissionsRequest {
  repeated AnnettePrincipal principals = 1;
  repeated Permission permissions = 2;
}

message BooleanResponse {
  bool result = 1;
}

message FindAssignmentsQuery {
  int32 offset = 1;
  int32 size = 2;
  Permission permission = 3;
  string principal_type = 4;
  string principal_id = 5;
  AuthSource source = 6;
  repeated SortBy sort_by = 7;
}

message PermissionAssignment {
  AnnettePrincipal principal = 1;
  Permission permission = 2;
  AuthSource source = 3;
  optional AnnettePrincipal updated_by = 4;
  optional string updated_at = 5;
}

message AssignmentFindResult {
  int64 total = 1;
  repeated AssignmentHitResult hits = 2;
}

message AssignmentHitResult {
  string id = 1;
  float score = 2;
  PermissionAssignment assignment = 3;
}

// =============================================================================
// Find-result (generic; mirrors biz.lobachev.annette.core.model.indexing.FindResult)
// =============================================================================

message FindResult {
  int64 total = 1;
  repeated HitResult hits = 2;
}

message HitResult {
  string id = 1;
  float score = 2;
  string updated_at = 3;
}
