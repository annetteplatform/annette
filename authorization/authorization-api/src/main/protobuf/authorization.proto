  rpc AssignPermission(AssignPermissionPayload) returns (google.protobuf.Empty);
  rpc UnassignPermission(UnassignPermissionPayload) returns (google.protobuf.Empty);
  rpc FindPermissions(FindPermissionsRequest) returns (FindPermissionsResponse);
