# Slice 004: renamed akka.* → pekko.*. Serializer ids use the pekko.jackson-json /
# pekko-misc serializers provided by Pekko's Jackson integration. Events (the Event
# sealed traits) are serialized via Pekko Jackson as well — they're not in the .proto
# because they're internal (D1: protobuf only for the public gRPC contract).
pekko.actor {
  serialization-bindings {
    "biz.lobachev.annette.authorization.impl.role.RoleEntity$CommandSerializable" = jackson-json
    "biz.lobachev.annette.authorization.impl.assignment.AssignmentEntity$CommandSerializable" = jackson-json
    "biz.lobachev.annette.authorization.impl.role.RoleEntity$Event" = jackson-json
    "biz.lobachev.annette.authorization.impl.assignment.AssignmentEntity$Event" = jackson-json
    "org.apache.pekko.Done" = pekko-misc
    "org.apache.pekko.actor.Address" = pekko-misc
    "org.apache.pekko.remote.UniqueAddress" = pekko-misc
  }
}
