// Mirrors biz.lobachev.annette.core.model.auth.AnnettePrincipal (code format: "type~id").
message AnnettePrincipal {
  string code = 1;
}

// Mirrors biz.lobachev.annette.core.model.indexing.SortBy.
message SortBy {
  string field = 1;
  optional bool descending = 2;
}

// Mirrors biz.lobachev.annette.core.model.indexing.FindResult.
message FindResult {
  int64 total = 1;
  repeated HitResult hits = 2;
}

message HitResult {
  string id = 1;
  float score = 2;
  string updated_at = 3; // RFC3339 / ISO-8601 offset-date-time
}

