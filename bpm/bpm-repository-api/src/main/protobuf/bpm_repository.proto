syntax = "proto3";

package biz.lobachev.annette.bpm_repository.api;

option java_package = "biz.lobachev.annette.bpm_repository.api.grpc";

import "google/protobuf/empty.proto";

// BPM repository service — Pekko gRPC contract for the migrated bpm-repository
// microservice (slice 012).
//
// Generated by PekkoGrpcPlugin. The generated trait BpmRepositoryService lives
// in package biz.lobachev.annette.bpm_repository.api.grpc — distinct from the
// existing plain-Scala trait of the same simple name in
// biz.lobachev.annette.bpm_repository.api. The two coexist during the
// migration: the plain trait is what the gateway's controllers consume; the
// generated trait is what the service impl extends.
//
// 35 RPCs mirror BpmRepositoryServiceApi.descriptor's pathCalls 1:1
// (9 bpm-model + 9 data-schema + 17 business-process).
//
// Postgres-only service, zero event-sourced entities, zero read-side
// processors — the Slick layer is untouched; only the contract changed.
//
// Complex types serialized as JSON strings per D1 (play-json at the gateway;
// protobuf intra-cluster for primitive/simple types):
//   - Scala Enumeration values (Notation, Datatype, ProcessDefinitionType) —
//     string, same wire representation as the REST JSON (Notation /
//     ProcessDefinitionType lowercase, Datatype as its toString).
// Wrapped-string value classes (BpmModelId, DataSchemaId, BusinessProcessId,
// VariableName, ProcessDefinition) — plain string.
// OffsetDateTime → ISO-8601 string. Map[String, V] → map<string, V>.

service BpmRepositoryService {
  // === BPM Models ===
  rpc CreateBpmModel(CreateBpmModelPayload) returns (BpmModel);
  rpc UpdateBpmModel(UpdateBpmModelPayload) returns (BpmModel);
  rpc UpdateBpmModelName(UpdateBpmModelNamePayload) returns (BpmModel);
  rpc UpdateBpmModelDescription(UpdateBpmModelDescriptionPayload) returns (BpmModel);
  rpc UpdateBpmModelXml(UpdateBpmModelXmlPayload) returns (BpmModel);
  rpc DeleteBpmModel(DeleteBpmModelPayload) returns (google.protobuf.Empty);
  rpc GetBpmModel(GetBpmModelRequest) returns (BpmModel);
  rpc GetBpmModels(GetBpmModelsRequest) returns (GetBpmModelsResponse);
  rpc FindBpmModels(BpmModelFindQuery) returns (FindResult);

  // === Data Schemas ===
  rpc CreateDataSchema(CreateDataSchemaPayload) returns (DataSchema);
  rpc UpdateDataSchema(UpdateDataSchemaPayload) returns (DataSchema);
  rpc UpdateDataSchemaName(UpdateDataSchemaNamePayload) returns (DataSchema);
  rpc UpdateDataSchemaDescription(UpdateDataSchemaDescriptionPayload) returns (DataSchema);
  rpc StoreDataSchemaVariable(StoreDataSchemaVariablePayload) returns (DataSchema);
  rpc DeleteDataSchemaVariable(DeleteDataSchemaVariablePayload) returns (DataSchema);
  rpc DeleteDataSchema(DeleteDataSchemaPayload) returns (google.protobuf.Empty);
  rpc GetDataSchema(GetDataSchemaRequest) returns (DataSchema);
  rpc GetDataSchemas(GetDataSchemasRequest) returns (GetDataSchemasResponse);
  rpc FindDataSchemas(DataSchemaFindQuery) returns (FindResult);

  // === Business Processes ===
  rpc CreateBusinessProcess(CreateBusinessProcessPayload) returns (BusinessProcess);
  rpc UpdateBusinessProcess(UpdateBusinessProcessPayload) returns (BusinessProcess);
  rpc UpdateBusinessProcessName(UpdateBusinessProcessNamePayload) returns (BusinessProcess);
  rpc UpdateBusinessProcessDescription(UpdateBusinessProcessDescriptionPayload) returns (BusinessProcess);
  rpc UpdateBusinessProcessBpmModel(UpdateBusinessProcessBpmModelPayload) returns (BusinessProcess);
  rpc UpdateBusinessProcessDataSchema(UpdateBusinessProcessDataSchemaPayload) returns (BusinessProcess);
  rpc UpdateBusinessProcessProcessDefinition(UpdateBusinessProcessProcessDefinitionPayload) returns (BusinessProcess);
  rpc StoreBusinessProcessVariable(StoreBusinessProcessVariablePayload) returns (BusinessProcess);
  rpc DeleteBusinessProcessVariable(DeleteBusinessProcessVariablePayload) returns (BusinessProcess);
  rpc DeleteBusinessProcess(DeleteBusinessProcessPayload) returns (google.protobuf.Empty);
  rpc GetBusinessProcess(GetBusinessProcessRequest) returns (BusinessProcess);
  rpc GetBusinessProcesses(GetBusinessProcessesRequest) returns (GetBusinessProcessesResponse);
  rpc FindBusinessProcesses(BusinessProcessFindQuery) returns (FindResult);
}

