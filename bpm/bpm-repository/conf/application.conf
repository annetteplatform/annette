play.application.loader = biz.lobachev.annette.bpm_repository.impl.BpmRepositoryServiceMain
play.http.secret.key = ${?SECRET_KEY}
play.server.pidfile.path = "/dev/null"

# Postgres-only service with zero entities / zero sharding / zero projections:
# the actor system stays local (no cluster — see dev/migration/012 §Locked
# assumptions; artery reservation 17364 from the D2 port table is unused).

# Pekko gRPC requires HTTP/2 on the server (verified at runtime in slice 011;
# without it the server binds but rejects the h2 preface with "PRI" 501s).
pekko.http.server.preview.enable-http2 = on

annette {
  cluster {
    system-name = "bpm-repository"
    system-name = ${?AKKA_CLUSTER_SYSTEM_NAME}
  }
  http {
    host = "127.0.0.1"
    host = ${?HTTP_HOST}
    port = 8513
    port = ${?HTTP_PORT}
  }
}

bpm-repository-db = {
  connectionPool = "HikariCP"
  dataSourceClass = "org.postgresql.ds.PGSimpleDataSource"
  properties = {
    serverName = "localhost"
    serverName = ${?POSTGRES_SERVER}
    portNumber = "5432"
    portNumber = ${?POSTGRES_PORT}
    databaseName = ${?POSTGRES_PREFIX}"bpm_repository"
    databaseName = ${?POSTGRES_DB}
    user = "bpm_repository"
    user = ${?POSTGRES_USERNAME}
    password = "bpm_repository"
    password = ${?POSTGRES_PASSWORD}
  }
  numThreads = 10
}
