}

message ChangeWidgetOrderPayload {
  string id = 1;
  optional string content_type = 2; // intro | post | (absent for pages)
  string widget_id = 3;
  int32 order = 4;
  AnnettePrincipal updated_by = 5;
}

message DeleteWidgetPayload {
  string id = 1;
  optional string content_type = 2; // intro | post | (absent for pages)
  string widget_id = 3;
  AnnettePrincipal updated_by = 4;
}

