annette.cms {
  storage-bucket = ${?CMS_STORAGE_BUCKET_PREFIX}cms-storage-bucket
  storag-bucket = ${?CMS_STORAGE_BUCKET}
}

# Alpakka S3 — used by the akka-based CmsStorage, which the api-gateway (still on
# Play 2.8.x / Akka until slice 013) wires directly. Kept alongside the Pekko
# variant below; slice 013 removes this block together with CmsStorage.
alpakka.s3 {
  aws {
    credentials {
      provider = static
      access-key-id = "minioadmin"
      access-key-id = ${?MINIO_ACCESS_KEY}
      secret-access-key = "minioadmin"
      secret-access-key = ${?MINIO_SECRET_KEY}
    }
    region {
      provider = static
      default-region = "us-east-1"
    }
  }
  access-style = path
  endpoint-url = "http://localhost:9002"
  endpoint-url = ${?MINIO_URL}
}

# Pekko Connectors S3 (slice 011) — used by the migrated cms microservice's
# CmsStoragePekko. NOTE: Pekko Connectors 1.1.0 renamed the config namespace from
# alpakka.s3 to pekko.connectors.s3 (verified against the artifact's
# reference.conf); the keys within are unchanged.
pekko.connectors.s3 {
  aws {
    credentials {
      provider = static
      access-key-id = "minioadmin"
      access-key-id = ${?MINIO_ACCESS_KEY}
      secret-access-key = "minioadmin"
      secret-access-key = ${?MINIO_SECRET_KEY}
    }
    region {
      provider = static
      default-region = "us-east-1"
    }
  }
  access-style = path
  endpoint-url = "http://localhost:9002"
  endpoint-url = ${?MINIO_URL}
}


