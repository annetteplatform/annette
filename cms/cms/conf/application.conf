play.application.loader = biz.lobachev.annette.cms.impl.CmsServiceMain
play.http.secret.key = ${?SECRET_KEY}
play.server.pidfile.path = "/dev/null"

pekko.actor.provider = cluster
pekko.cluster.sharding.state-store-mode = ddata

# Pekko gRPC requires HTTP/2 on the server (verified at runtime in slice 011;
# without it the server binds but rejects the h2 preface with "PRI" 501s).
pekko.http.server.preview.enable-http2 = on

annette {
  cluster {
    system-name = "cms"
    system-name = ${?AKKA_CLUSTER_SYSTEM_NAME}
  }
  http {
    host = "127.0.0.1"
    host = ${?HTTP_HOST}
    port = 8514
    port = ${?HTTP_PORT}
  }
}

indexing {
  connection {
    url = "https://localhost:9200"
    url = ${?INDEXING_URL}
    username = "admin"
    username = ${?INDEXING_USERNAME}
    password = "admin"
    password = ${?INDEXING_PASSWORD}
    allow-insecure = false
    allow-insecure = ${?INDEXING_ALLOW_INSECURE}
  }

  blog-index {
    index = ${?INDEX_PREFIX}cms-blog
    index = ${?CMS_BLOG_INDEX}
    mappings {
      id {type = keyword}
      name {
        type = text
        fields {
          keyword {
            type = keyword
          }
        }
      }
      description {type = text}
      categoryId {type = keyword}
      authors {type = keyword}
      targets {type = keyword}
      active {type = boolean}
      updatedBy {type = keyword}
      updatedAt {type = date}
    }
  }

  post-index {
    index = ${?INDEX_PREFIX}cms-post
    index = ${?CMS_POST_INDEX}
    mappings {
      id {type = keyword}
      blogId {type = keyword}
      featured {type = boolean}
      authorId {type = keyword}
      title {
        type = text
        fields {
          keyword {
            type = keyword
          }
        }
      }
      intro {type = text}
      content {type = text}
      publicationStatus {type = keyword}
      publicationTimestamp {type = date}
      targets {type = keyword}
      updatedBy {type = keyword}
      updatedAt {type = date}
    }
  }

  blog-category-index {
    index = ${?INDEX_PREFIX}cms-blog-category
    index = ${?CMS_BLOG_CATEGORY_INDEX}
    mappings {
      id {
        type = keyword
      }
      name {
        type = text
        fields {
          keyword {
            type = keyword
          }
        }
      }
      updatedAt {
        type = date
      }
    }
  }

  space-index {
    index = ${?INDEX_PREFIX}cms-space
    index = ${?CMS_SPACE_INDEX}
    mappings {
      id {type = keyword}
      name {
        type = text
        fields {
          keyword {
            type = keyword
          }
        }
      }
      description {type = text}
      categoryId {type = keyword}
      authors {type = keyword}
      targets {type = keyword}
      active {type = boolean}
      updatedBy {type = keyword}
      updatedAt {type = date}
    }
  }

  page-index {
    index = ${?INDEX_PREFIX}cms-page
    index = ${?CMS_PAGE_INDEX}
    mappings {
      id {type = keyword}
      spaceId {type = keyword}
      authorId {type = keyword}
      title {
        type = text
        fields {
          keyword {
            type = keyword
          }
        }
      }
      content {type = text}
      publicationStatus {type = keyword}
      publicationTimestamp {type = date}
      targets {type = keyword}
      updatedBy {type = keyword}
      updatedAt {type = date}
    }
  }

  space-category-index {
    index = ${?INDEX_PREFIX}cms-space-category
    index = ${?CMS_SPACE_CATEGORY_INDEX}
    mappings {
      id {
        type = keyword
      }
      name {
        type = text
        fields {
          keyword {
            type = keyword
          }
        }
      }
      updatedAt {
        type = date
      }
    }
  }

  home-page-index  {
    index = ${?INDEX_PREFIX}cms-home-page
    index = ${?CMS_HOME_PAGE_INDEX}
    mappings {
      id { type = keyword }
      applicationId { type = keyword }
      principalCode { type = keyword }
      principalType { type = keyword }
      principalId { type = keyword }
      priority { type = integer }
      pageId { type = keyword }
      updatedBy {type = keyword}
      updatedAt {type = date}
    }
  }
}

cassandra.default {
  ## list the contact points here
  contact-points = "localhost:9042"
  contact-points = ${?CASSANDRA_URL}
  ## keyspace name
  keyspace = ${?KEYSPACE_PREFIX}cms
  keyspace = ${?KEYSPACE}
  ## authentication
  authentication {
    username = "cassandra"
    username = ${?CASSANDRA_USERNAME}
    password = "cassandra"
    password = ${?CASSANDRA_PASSWORD}
  }

  session-provider = pekko.persistence.cassandra.ConfigSessionProvider
  replication-factor = ${?CASSANDRA_REPLICATION_FACTOR}
}

# Quill context config (driver 3). Quill 3.10's config-driven ClusterBuilder cannot
# express contact-points-with-ports or credentials, so the Pekko-variant CassandraQuillDao
# builds the driver-3 Cluster itself from this surface (first verified at runtime in
# slice 011).
cassandra-quill {
  session {
    contact-points = ["localhost:9042", ${?CASSANDRA_URL}]
    credentials {
      username = "cassandra"
      username = ${?CASSANDRA_USERNAME}
      password = "cassandra"
      password = ${?CASSANDRA_PASSWORD}
    }
  }
  keyspace = ${?KEYSPACE_PREFIX}cms
  keyspace = ${?KEYSPACE}
  keyspace-autocreate = true
  replication-factor = ${?CASSANDRA_REPLICATION_FACTOR}
}

# DataStax driver 4 config — used by BOTH Pekko Persistence Cassandra and Pekko
# Projection Cassandra (both resolve their session via DefaultSessionProvider
# against this path; first verified at runtime in slice 011).
datastax-java-driver {
  basic {
    contact-points = ["localhost:9042"]
    contact-points = ${?CASSANDRA_URL}
    load-balancing-policy.local-datacenter = "datacenter1"
    load-balancing-policy.local-datacenter = ${?CASSANDRA_DATACENTER}
  }
  advanced.auth-provider {
    class = PlainTextAuthProvider
    username = "cassandra"
    username = ${?CASSANDRA_USERNAME}
    password = "cassandra"
    password = ${?CASSANDRA_PASSWORD}
  }
}

cassandra-journal = ${cassandra.default}
cassandra-snapshot-store = ${cassandra.default}

# Pekko Persistence Cassandra. Lagom used to wire the journal/snapshot plugin ids;
# without these the entity asks time out on first Recovery (first verified at
# runtime in slice 011).
pekko.persistence.journal.plugin = "pekko.persistence.cassandra.journal"
pekko.persistence.snapshot-store.plugin = "pekko.persistence.cassandra.snapshot"

pekko.persistence.cassandra {
  journal {
    keyspace = ${?KEYSPACE_PREFIX}cms
    keyspace = ${?KEYSPACE}
    keyspace-autocreate = true
    tables-autocreate = true
  }
  snapshot {
    keyspace = ${?KEYSPACE_PREFIX}cms
    keyspace = ${?KEYSPACE}
    keyspace-autocreate = true
    tables-autocreate = true
  }
}

# events-by-tag configuration. NOTE (verified at runtime in slice 011): in
# pekko-persistence-cassandra these keys live under `events-by-tag` directly —
# NOT under `journal.events-by-tag` / `query.events-by-tag` as in the Lagom-era
# layout. With the wrong paths the defaults (EC delay 5s, first-time-bucket
# 2015) silently apply and projections stall scanning ~4000 empty day-buckets.
pekko.persistence.cassandra.events-by-tag.flush-interval = 100ms
pekko.persistence.cassandra.events-by-tag.flush-interval = ${?FLUSH_INTERVAL}
pekko.persistence.cassandra.events-by-tag.eventual-consistency-delay = 100ms
pekko.persistence.cassandra.events-by-tag.eventual-consistency-delay = ${?EVENTUAL_CONSISTENCY_DELAY}
pekko.persistence.cassandra.events-by-tag.delayed-event-timeout = 30s
pekko.persistence.cassandra.events-by-tag.delayed-event-timeout = ${?DELAYED_EVENT_TIMEOUT}
pekko.persistence.cassandra.events-by-tag.first-time-bucket = "20211201T00:00"
pekko.persistence.cassandra.events-by-tag.first-time-bucket = ${?FIRST_TIME_BUCKET}
pekko.persistence.cassandra.query.refresh-interval = 100ms
pekko.persistence.cassandra.query.refresh-interval = ${?REFRESH_INTERVAL}

# Pekko Projection Cassandra offset store
pekko.projection.cassandra {
  session-config-path = "pekko.persistence.cassandra"
  offset-store {
    keyspace = ${?KEYSPACE_PREFIX}pekko_projection
    keyspace = ${?PEKKO_PROJECTION_KEYSPACE}
    table = "offset_store"
    management-table = "projection_management"
  }
}
