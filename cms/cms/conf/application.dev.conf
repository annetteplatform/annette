include "application.conf"

# Dev-mode fixed ports (D2). Per dev/migration/002-build-and-gateway-foundations.md step 7.
# Slice 003 onward binds the service's own Http().newServerAt(...) to annette.http.port.
pekko.remote.artery.canonical.port = 17365
annette.http.port = 8514

# Single-member dev cluster: the node joins itself (replaces Lagom's implicit
# join-self; without it ClusterSharding entities never allocate and entity asks
# time out — first verified at runtime in slice 011).
pekko.cluster.seed-nodes = ["pekko://cms@127.0.0.1:17365"]
