pekko {
  loglevel = INFO
  actor {
    provider = cluster
    allow-java-serialization = off
    serialization-bindings {
      "spike.CounterEntity$Command"        = jackson-json
      "spike.CounterEntity$Event"          = jackson-json
      "spike.CounterEntity$Incremented"    = jackson-json
      "spike.CounterEntity$Decremented"    = jackson-json
      "spike.CounterEntity$Command"        = jackson-json
    }
    serializers {
      jackson-json = "org.apache.pekko.serialization.jackson.JacksonJsonSerializer"
    }
  }
  remote.artery {
    canonical.hostname = "127.0.0.1"
    canonical.port     = 17355
  }
  cluster {
    seed-nodes = ["pekko://spike-projection@127.0.0.1:17355"]
    downing-provider-class = "org.apache.pekko.cluster.sbr.SplitBrainResolverProvider"
  }
  persistence {
    journal {
      plugin = "pekko.persistence.cassandra.journal"
    }
    snapshot {
      plugin = "pekko.persistence.cassandra.snapshot"
    }
  }
}

pekko.persistence.cassandra {
  journal {
    keyspace = spike_projection
    keyspace-autocreate = true
    tables-autocreate = true
  }
  snapshot {
    keyspace = spike_projection_snapshot
    keyspace-autocreate = true
    tables-autocreate = true
  }
  query {
    refresh-interval = 1s
  }
}

pekko.projection.cassandra {
  offset-store {
    keyspace = spike_offset
    table = offset_store
    management-table = projection_management
    keyspace-autocreate = true
    table-autocreate = true
  }
}

datastax-java-driver {
  basic {
    contact-points = ["127.0.0.1:9042"]
    load-balancing-policy.local-datacenter = "datacenter1"
  }
  advanced.reconnect-on-init = true
}
