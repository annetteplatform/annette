# Pekko gRPC clients for the seeding targets (dev-mode ports; see AGENTS.md port table).
pekko.grpc.client {
  authorization {
    host = "127.0.0.1"
    port = 8512
    use-tls = false
  }
  service-catalog {
    host = "127.0.0.1"
    port = 8511
    use-tls = false
  }
  application {
    host = "127.0.0.1"
    port = 8510
    use-tls = false
  }
  org-structure {
    host = "127.0.0.1"
    port = 8516
    use-tls = false
  }
  persons {
    host = "127.0.0.1"
    port = 8517
    use-tls = false
  }
  principal-groups {
    host = "127.0.0.1"
    port = 8518
    use-tls = false
  }
  cms {
    host = "127.0.0.1"
    port = 8514
    use-tls = false
  }
}

include "ignition.conf"
