          markdown: "This page is the starting point for every new employee. It gives a short overview of the company and links the most important handbooks."
      w2:
        id: w2
        widgetType: markdown
        data:
          markdown: |
            ## About the company

            The company was founded to build software that makes business applications easy to
            assemble and operate. The Annette Platform is our cloud-native application platform:
            microservices on the JVM, event-sourced services and a web console. Have a look at
            the Pekko documentation blog to learn how it is built.
