        widgetType: markdown
        data:
          markdown: |
            We treat colleagues, customers and partners with respect. We communicate openly and
            give constructive feedback. Decisions are documented in the respective spaces so
            that everyone can follow them. When in doubt, ask - there are no stupid questions.
- id: onboarding
  spaceId: hr
  authorId: person~P0002
  title: Onboarding checklist
  publicationStatus: published
  publicationTimestamp: "2026-08-01T09:00:00Z"
  content:
    settings: {}
    widgetOrder: ["w1"]
    widgets:
      w1:
        id: w1
        widgetType: markdown
        data:
          markdown: |
            1. Get your accounts from the IT helpdesk (console, email, VPN).
            2. Read the company handbook, starting with the code of conduct.
            3. Meet your onboarding buddy and your team lead in the first week.
            4. Complete the security awareness training within 30 days.
