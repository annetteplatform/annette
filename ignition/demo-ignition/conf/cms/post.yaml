  introContent:
    settings: {}
    widgetOrder: ["intro"]
    widgets:
      intro:
        id: intro
        widgetType: markdown
        data:
          markdown: "A short checklist for the accounts receivable month-end closing."
  content:
    settings: {}
    widgetOrder: ["w1"]
    widgets:
      w1:
        id: w1
        widgetType: markdown
        data:
          markdown: |
            1. Post incoming payments and clear open items.
            2. Run the dunning proposal and send dunning notices.
            3. Reconcile the accounts receivable subledger with the general ledger.
            4. Create the foreign currency valuation run.
