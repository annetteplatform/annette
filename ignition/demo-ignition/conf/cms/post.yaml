- id: pekko-01
  blogId: pekko
  authorId: person~P0001
  title: What is Pekko?
  featured: true
  publicationStatus: published
  publicationTimestamp: "2026-07-01T09:00:00Z"
  introContent:
    settings: {}
    widgetOrder: ["intro"]
    widgets:
      intro:
        id: intro
        widgetType: markdown
        data:
          markdown: "Apache Pekko is a toolkit for building highly concurrent, distributed and resilient message-driven applications on the JVM."
  content:
    settings: {}
    widgetOrder: ["w1", "w2"]
    widgets:
      w1:
        id: w1
        widgetType: markdown
        data:
          markdown: |
            The key to building an elastic, resilient and responsive system is starting with the
            right architecture - one rooted in a solid understanding of microservices, including
            concepts and best practices. Apache Pekko provides an opinionated toolkit that acts
            like guide rails to speed you along the journey.
      w2:
        id: w2
        widgetType: markdown
        data:
          markdown: |
            ## The actor model

            Pekko keeps the actor model at its core: applications are built from actors that
            communicate only by exchanging messages, which makes systems easy to scale out
            across a cluster. Pekko is developed under the Apache Software Foundation as a
            fork of Akka and stays true to its reactive roots.
- id: pekko-02
  blogId: pekko
  authorId: person~P0001
  title: Event sourcing with Pekko Persistence
  publicationStatus: published
  publicationTimestamp: "2026-07-05T10:30:00Z"
  introContent:
    settings: {}
    widgetOrder: ["intro"]
    widgets:
      intro:
        id: intro
        widgetType: markdown
        data:
          markdown: "Pekko Persistence enables event-sourced actors: every state change is stored as an immutable event in a journal and replayed to rebuild state."
  content:
    settings: {}
    widgetOrder: ["w1"]
    widgets:
      w1:
        id: w1
        widgetType: markdown
        data:
          markdown: |
            An event-sourced actor never persists its current state directly. Instead it persists
            the events that led to the state. The journal is backed by Apache Cassandra in the
            Annette Platform, and Pekko Projection feeds read-side databases such as OpenSearch
            for querying. This combination gives the platform an audit log for free and lets
            read models be rebuilt at any time from the journal.
- id: pekko-03
  blogId: pekko
  authorId: person~P0001
  title: Service-to-service calls with Pekko gRPC
  publicationStatus: published
  publicationTimestamp: "2026-07-12T08:15:00Z"
  introContent:
    settings: {}
    widgetOrder: ["intro"]
    widgets:
      intro:
        id: intro
        widgetType: markdown
        data:
          markdown: "Every Annette microservice exposes its API twice: as HTTP through the gateway and as Pekko gRPC for inter-service calls."
  content:
    settings: {}
    widgetOrder: ["w1"]
    widgets:
      w1:
        id: w1
        widgetType: markdown
        data:
          markdown: |
            The API of each service is defined once in a protobuf file. The generated gRPC
            server is bound on the service HTTP port, while Play 3-based api-gateway acts as
            the single public REST entry point and delegates to the services over gRPC.
            Error semantics travel in a dedicated trailer so typed exceptions survive the hop.
