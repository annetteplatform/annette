syntax = "proto3";

package biz.lobachev.annette.org_structure.api;

option java_package = "biz.lobachev.annette.org_structure.api.grpc";

import "google/protobuf/empty.proto";

// Org-structure service — Pekko gRPC contract for the migrated org-structure microservice.
//
// Generated by PekkoGrpcPlugin (slice 007). 40 RPCs mirror OrgStructureServiceApi.descriptor's
// pathCalls 1:1 (16 hierarchy mutations + 8 hierarchy queries + 4 attribute methods +
// 6 OrgRole + 6 Category).
//
// Complex types (Organization, OrganizationTree, OrgItem sealed trait, AttributeMetadata
// sealed trait) are serialized as JSON strings per D1. The service impl uses play-json to
// serialize/deserialize; the gateway controller will parse them with play-json as well.

service OrgStructureService {
  // === Hierarchy mutations (16) ===
  rpc CreateOrganization(CreateOrganizationPayload) returns (google.protobuf.Empty);
  rpc CreateUnit(CreateUnitPayload) returns (google.protobuf.Empty);
  rpc CreatePosition(CreatePositionPayload) returns (google.protobuf.Empty);
  rpc UpdateName(UpdateNamePayload) returns (google.protobuf.Empty);
  rpc AssignCategory(AssignCategoryPayload) returns (google.protobuf.Empty);
  rpc UpdateSource(UpdateSourcePayload) returns (google.protobuf.Empty);
  rpc UpdateExternalId(UpdateExternalIdPayload) returns (google.protobuf.Empty);
  rpc MoveItem(MoveItemPayload) returns (google.protobuf.Empty);
  rpc AssignChief(AssignChiefPayload) returns (google.protobuf.Empty);
  rpc UnassignChief(UnassignChiefPayload) returns (google.protobuf.Empty);
  rpc ChangePositionLimit(ChangePositionLimitPayload) returns (google.protobuf.Empty);
  rpc AssignPerson(AssignPersonPayload) returns (google.protobuf.Empty);
  rpc UnassignPerson(UnassignPersonPayload) returns (google.protobuf.Empty);
  rpc AssignOrgRole(AssignOrgRolePayload) returns (google.protobuf.Empty);
  rpc UnassignOrgRole(UnassignOrgRolePayload) returns (google.protobuf.Empty);
  rpc DeleteOrgItem(DeleteOrgItemPayload) returns (google.protobuf.Empty);

  // === Hierarchy queries (8) ===
  rpc GetOrganization(GetOrganizationRequest) returns (GetOrganizationResponse);
  rpc GetOrganizationTree(GetOrganizationTreeRequest) returns (GetOrganizationTreeResponse);
  rpc GetOrgItem(GetOrgItemRequest) returns (GetOrgItemResponse);
  rpc GetOrgItems(GetOrgItemsRequest) returns (GetOrgItemsResponse);
  rpc GetItemIdsByExternalId(GetItemIdsByExternalIdRequest) returns (GetItemIdsByExternalIdResponse);
  rpc GetPersonPrincipals(GetPersonPrincipalsRequest) returns (GetPersonPrincipalsResponse);
  rpc GetPersonPositions(GetPersonPositionsRequest) returns (GetPersonPositionsResponse);
  rpc FindOrgItems(OrgItemFindQuery) returns (FindResult);

  // === OrgItem attribute methods (4) ===
  rpc GetOrgItemMetadata(google.protobuf.Empty) returns (GetOrgItemMetadataResponse);
  rpc UpdateOrgItemAttributes(UpdateAttributesPayload) returns (google.protobuf.Empty);
  rpc GetOrgItemAttributes(GetOrgItemAttributesRequest) returns (AttributeValuesResponse);
  rpc GetOrgItemsAttributes(GetOrgItemsAttributesRequest) returns (GetOrgItemsAttributesResponse);

  // === OrgRole methods (6) ===
  rpc CreateOrgRole(CreateOrgRolePayload) returns (google.protobuf.Empty);
  rpc UpdateOrgRole(UpdateOrgRolePayload) returns (google.protobuf.Empty);
  rpc DeleteOrgRole(DeleteOrgRolePayload) returns (google.protobuf.Empty);
  rpc GetOrgRole(GetOrgRoleRequest) returns (OrgRole);
  rpc GetOrgRoles(GetOrgRolesRequest) returns (GetOrgRolesResponse);
  rpc FindOrgRoles(OrgRoleFindQuery) returns (FindResult);

  // === Category methods (6) ===
  rpc CreateCategory(CreateCategoryPayload) returns (google.protobuf.Empty);
  rpc UpdateCategory(UpdateCategoryPayload) returns (google.protobuf.Empty);
  rpc DeleteCategory(DeleteCategoryPayload) returns (google.protobuf.Empty);
  rpc GetCategory(GetCategoryRequest) returns (OrgCategory);
  rpc GetCategories(GetCategoriesRequest) returns (GetCategoriesResponse);
  rpc FindCategories(OrgCategoryFindQuery) returns (FindResult);
}

// =============================================================================
// Shared / common messages
// =============================================================================

message AnnettePrincipal {
  string code = 1;
}

message SortBy {
  string field = 1;
  optional bool descending = 2;
}

message PersonPosition {
  string person_id = 1;
  string position_id = 2;
}

message FindResult {
  int64 total = 1;
  repeated HitResult hits = 2;
}

message HitResult {
  string id = 1;
  float score = 2;
  string updated_at = 3;
}

message AttributeValuesResponse {
  map<string, string> values = 1;
}

