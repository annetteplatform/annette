include "application.conf"

# Dev-mode fixed ports (D2). Per dev/migration/002-build-and-gateway-foundations.md step 7.
# Slice 003 onward binds the service's own Http().newServerAt(...) to annette.http.port.
pekko.remote.artery.canonical.port = 17367

# Single-member dev cluster: the node joins itself (replaces Lagom's implicit
# join-self; without it ClusterSharding entities never allocate and entity asks
# time out — verified at runtime for cms in slice 011, applied to all services
# in slice 013).
pekko.cluster.seed-nodes = ["pekko://org-structure@127.0.0.1:17367"]
annette.http.port = 8516


attributes {
  org-item-schema {

    positionCategory {
      type = string
      subtype = position-category
      allowed-values = ["K1", "K2", "K3", "K4", "K5"]
      caption-text = Position Category
      index = positionCategory
    }

    storeId {
      type = string
      subtype = storeId
      caption-text = Store Id
      index = storeId
    }

    description {
      type = string
      caption-text = Description
      read-side-persistence = true
    }

  }
}

indexing {
  items-index {
    mappings {
      positionCategory {type = keyword}
      storeId {type = keyword}
    }
  }
}
