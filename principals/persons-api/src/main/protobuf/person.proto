  AnnettePrincipal updated_by = 2;
}

message Person {
  string id = 1;
  string lastname = 2;
  string firstname = 3;
  optional string middlename = 4;
  string category_id = 5;
  optional string phone = 6;
  optional string email = 7;
  optional string source = 8;
  optional string external_id = 9;
  map<string, string> attributes = 10;
  string updated_at = 11; // RFC3339 / ISO-8601 offset-date-time
