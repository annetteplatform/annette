}

message GetPersonRequest {
  string id = 1;
  optional string source = 2;
  optional string attributes = 3; // comma-separated attribute names
}

message GetPersonsRequest {
  repeated string ids = 1;
  optional string source = 2;
  optional string attributes = 3;
}

message GetPersonsResponse {
  repeated Person persons = 1;
}

message PersonFindQuery {
  int32 offset = 1;
  int32 size = 2;
  optional string filter = 3;
  optional string lastname = 4;
  optional string firstname = 5;
  optional string middlename = 6;
  optional string phone = 7;
  optional string email = 8;
  repeated string categories = 9;
  repeated string sources = 10;
  repeated string external_ids = 11;
  repeated SortBy sort_by = 12;
}

