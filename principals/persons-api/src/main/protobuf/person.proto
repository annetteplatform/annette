service PersonService {
  // === Person CRUD ===
  rpc CreatePerson(CreatePersonPayload) returns (google.protobuf.Empty);
  rpc UpdatePerson(UpdatePersonPayload) returns (google.protobuf.Empty);
  rpc DeletePerson(DeletePersonPayload) returns (google.protobuf.Empty);
  rpc GetPerson(GetPersonRequest) returns (Person);
  rpc GetPersons(GetPersonsRequest) returns (GetPersonsResponse);
  rpc FindPersons(PersonFindQuery) returns (FindResult);
  rpc GetPersonMetadata(google.protobuf.Empty) returns (GetPersonMetadataResponse);
  rpc UpdatePersonAttributes(UpdateAttributesPayload) returns (google.protobuf.Empty);
  rpc GetPersonAttributes(GetPersonAttributesRequest) returns (AttributeValuesResponse);
  rpc GetPersonsAttributes(GetPersonsAttributesRequest) returns (PersonsAttributesResponse);

  // === Category CRUD ===
  rpc CreateCategory(CreateCategoryPayload) returns (google.protobuf.Empty);
  rpc UpdateCategory(UpdateCategoryPayload) returns (google.protobuf.Empty);
  rpc DeleteCategory(DeleteCategoryPayload) returns (google.protobuf.Empty);
