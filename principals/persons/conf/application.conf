include "indexing.conf"

play.application.loader = biz.lobachev.annette.persons.impl.PersonServiceMain
play.http.secret.key = ${?SECRET_KEY}
play.server.pidfile.path = "/dev/null"

pekko.cluster.sharding.state-store-mode = ddata

annette {
  cluster {
    system-name = "persons"
    system-name = ${?AKKA_CLUSTER_SYSTEM_NAME}
  }
  http {
    host = "127.0.0.1"
    host = ${?HTTP_HOST}
    port = 8517
    port = ${?HTTP_PORT}
  }
}

cassandra.default {
  ## list the contact points here
  contact-points = "localhost:9042"
  contact-points = ${?CASSANDRA_URL}
  ## keyspace name
  keyspace = ${?KEYSPACE_PREFIX}persons
  keyspace = ${?KEYSPACE}
  ## authentication
  authentication {
    username = "cassandra"
    username = ${?CASSANDRA_USERNAME}
    password = "cassandra"
    password = ${?CASSANDRA_PASSWORD}
  }

  session-provider = akka.persistence.cassandra.ConfigSessionProvider
  replication-factor = ${?CASSANDRA_REPLICATION_FACTOR}
}

cassandra-quill = ${cassandra.default}

cassandra-journal = ${cassandra.default}
cassandra-snapshot-store = ${cassandra.default}

# Pekko Persistence Cassandra
pekko.persistence.cassandra {
  journal {
    keyspace = ${?KEYSPACE_PREFIX}persons
    keyspace = ${?KEYSPACE}
  }
  snapshot {
    keyspace = ${?KEYSPACE_PREFIX}persons
    keyspace = ${?KEYSPACE}
  }
}

pekko.persistence.cassandra.journal.events-by-tag.flush-interval = 100ms
pekko.persistence.cassandra.journal.events-by-tag.flush-interval = ${?FLUSH_INTERVAL}
pekko.persistence.cassandra.query.events-by-tag.eventual-consistency-delay = 100ms
pekko.persistence.cassandra.query.events-by-tag.eventual-consistency-delay = ${?EVENTUAL_CONSISTENCY_DELAY}
pekko.persistence.cassandra.query.delayed-event-timeout = 30s
pekko.persistence.cassandra.query.delayed-event-timeout = ${?DELAYED_EVENT_TIMEOUT}
pekko.persistence.cassandra.query.refresh-interval = 100ms
pekko.persistence.cassandra.query.refresh-interval = ${?REFRESH_INTERVAL}
pekko.persistence.cassandra.query.first-time-bucket = "20211201T00:00"
pekko.persistence.cassandra.query.first-time-bucket = ${?FIRST_TIME_BUCKET}
pekko.persistence.cassandra.journal.pubsub-minimum-interval = 200ms
pekko.persistence.cassandra.journal.pubsub-minimum-interval = ${?PUBSUB_MIN_INTERVAL}

# Pekko Projection Cassandra offset store
pekko.projection.cassandra {
  session-config-path = "pekko.persistence.cassandra"
  offset-store {
    keyspace = ${?KEYSPACE_PREFIX}pekko_projection
    keyspace = ${?PEKKO_PROJECTION_KEYSPACE}
    table = "offset_store"
    management-table = "projection_management"
  }
}
